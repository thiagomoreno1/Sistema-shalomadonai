services:
  evolution-api:
    environment:
      SERVER_URL: ${SERVER_URL:?Set SERVER_URL to the public HTTPS Evolution URL}
      SERVER_DISABLE_DOCS: "true"
      SERVER_DISABLE_MANAGER: "true"
      CORS_ORIGIN: https://45.13.235.147
      CORS_METHODS: GET,POST,PUT,DELETE
      CORS_CREDENTIALS: "false"

volumes:
  evolution_instances:
    external: true
    name: shalom-evolution-prod_evolution_instances
