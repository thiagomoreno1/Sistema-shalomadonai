# Supabase local development configuration.
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "mnsfdcqcsluhqtzqiiun"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
# Require explicit grants for newly created tables in the Data API.
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/redefinir-senha", "http://localhost:3000/redefinir-senha"]
# The app permits email/password accounts to request access. New accounts do
# not receive business access until an owner approves the request.
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enabled = true
enable_confirmations = false

[functions.create-delivery-driver]
verify_jwt = true

[functions.belvo-open-finance]
verify_jwt = true

[functions.belvo-sandbox-webhook]
verify_jwt = false

[functions.evolution-webhook]
enabled = true
verify_jwt = false
import_map = "./functions/evolution-webhook/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/evolution-webhook/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/evolution-webhook/*.html" ]

[functions.evolution-inbox]
enabled = true
verify_jwt = true
import_map = "./functions/evolution-inbox/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/evolution-inbox/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/evolution-inbox/*.html" ]
