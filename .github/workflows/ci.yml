name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check Edge Function types
        run: npx --yes deno@2.9.6 check supabase/functions/belvo-open-finance/index.ts supabase/functions/belvo-sandbox-webhook/index.ts supabase/functions/chatwoot-inbox/index.ts

      - name: Run lint
        run: npm run lint

      - name: Build production app
        run: npm run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js for the pinned Supabase CLI
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Start local database and apply migrations
        run: npx --yes supabase@2.122.0 db start

      - name: Lint local database schema
        run: npx --yes supabase@2.122.0 db lint --schema public,private --level warning

      - name: Run local pgTAP suites
        run: npx --yes supabase@2.122.0 test db
